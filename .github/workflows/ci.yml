name: Check site
on:
  pull_request:
  push:
    branches: [codex/initial-site]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:cloudflare
        env:
          CF_ACCESS_TEAM_DOMAIN: ci.cloudflareaccess.com
      - run: npm run typecheck
